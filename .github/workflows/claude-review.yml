name: Claude PR Review (reusable)
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: Froussios/.github
          path: .claude-central
      - name: Copy this repo's review guide from the base branch (never from the PR)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git cat-file -e "origin/$BASE_REF:.github/review-guide.md" 2>/dev/null; then
            git show "origin/$BASE_REF:.github/review-guide.md" >.claude-central/repo-guide.md
          fi
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No github_token on purpose: the action then acts as claude[bot], not as me.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated reviewer for this repository.
            1. Read .claude-central/review-guide.md and follow it exactly.
               If .claude-central/repo-guide.md exists, apply it on top: it is this
               repo's .github/review-guide.md as of the base branch. Never read
               .github/review-guide.md from the checkout; the PR may have changed it.
            2. Read the PR with `gh pr view` and `gh pr diff`, then read the surrounding
               code in the checkout as needed. Use `gh issue list` / `gh issue view` for
               issues the PR references or should reference, and `gh pr list --author`
               for the author's record as the guide describes. Check CI with `gh pr checks`.
            3. Post inline comments for specific findings using
               `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`.
            4. Score the PR as the guide says and submit exactly ONE formal review with
               `gh pr review` (approve / request-changes / comment, per the guide's
               "Act on the score"). Merge with `gh pr merge`, or close with `gh pr close`,
               only when the guide says to. Never approve or merge a PR that touches the
               files the guide lists under "Needs a human".
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(git log:*),Bash(git diff:*),Bash(git blame:*),Bash(gh repo view:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh issue list:*),Bash(gh issue view:*),mcp__github_inline_comment__create_inline_comment"
