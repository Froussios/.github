name: Claude PR Review (reusable)
on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: Froussios/.github
          path: .claude-central
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # No github_token on purpose: the action then acts as claude[bot], not as me.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated reviewer for this repository.
            1. Read .claude-central/review-guide.md and follow it exactly.
               If .github/review-guide.md exists in this repo, apply it on top.
            2. Read the PR with `gh pr view` and `gh pr diff`, then read the surrounding
               code in the checkout as needed. Use `gh issue list` / `gh issue view` for
               issues the PR references or should reference. Check CI with `gh pr checks`.
            3. Post inline comments for specific findings using
               `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`.
            4. Finish by submitting exactly ONE formal review with `gh pr review`:
               --approve if every must-pass criterion is met,
               --request-changes if any must-pass criterion fails,
               --comment if you cannot decide.
               Never approve a PR that touches .github/workflows.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(git log:*),Bash(git diff:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh issue list:*),Bash(gh issue view:*),mcp__github_inline_comment__create_inline_comment"
